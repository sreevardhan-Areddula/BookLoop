spring.application.name=bookloop-api
server.port=${SERVER_PORT:8081}
bookloop.jwt.secret=${BOOKLOOP_JWT_SECRET:}
bookloop.cookie.secure=${BOOKLOOP_COOKIE_SECURE:false}
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
bookloop.mail.mode=${BOOKLOOP_MAIL_MODE:APP_PASSWORD}
bookloop.mail.username=${BOOKLOOP_MAIL_USERNAME:}
bookloop.mail.from=${BOOKLOOP_MAIL_FROM:}
bookloop.mail.app-password=${BOOKLOOP_GMAIL_APP_PASSWORD:}
bookloop.mail.oauth-client-id=${BOOKLOOP_GMAIL_OAUTH_CLIENT_ID:}
bookloop.mail.oauth-client-secret=${BOOKLOOP_GMAIL_OAUTH_CLIENT_SECRET:}
bookloop.mail.oauth-refresh-token=${BOOKLOOP_GMAIL_OAUTH_REFRESH_TOKEN:}
bookloop.mail.frontend-url=${BOOKLOOP_FRONTEND_URL:http://localhost:5173}
bookloop.web.frontend-origin=${BOOKLOOP_FRONTEND_ORIGIN:http://localhost:5173}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
bookloop.sale-bills.max-pdf-pages=10
bookloop.ocr.data-path=${BOOKLOOP_TESSDATA_PATH:}
